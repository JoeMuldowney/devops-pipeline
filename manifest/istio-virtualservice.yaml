apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: interface-virtualservice
  namespace: default
spec:
  hosts:
    - "*"
  gateways:
    - shared-gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: ui-service
            port:
              number: 80
