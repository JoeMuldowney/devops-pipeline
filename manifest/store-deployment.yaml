apiVersion: apps/v1
kind: deployment
metadata:
  name: store-deployment
  labels:
    app: storeapi
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: storeapi
      tier: backend
  template:
    metadata:
      labels:
        app: storeapi
        tier: backend
    spec:
      containers:
        - name: store-microservice
          image: joemuldowney/django-microservice-api:v1
          ports:
            - containerPort: 8000

