apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: react-ui-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/JoeMuldowney/devops-pipeline.git'
    targetRevision: interface           
    path: .
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true